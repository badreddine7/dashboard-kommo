services:
  backend:
    build: ./backend
    container_name: kommo-pulse-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development  # Changed to development for local testing
      - PORT=3000
      - FRONTEND_URL=http://localhost  # Frontend URL for Stripe redirects
      # Database configuration comes from .env file
      # For local testing: Use Railway PostgreSQL credentials
      # DB_HOST=postgres.railway.internal
      # DB_USER=postgres
      # DB_PASSWORD=your_railway_password
      # DB_NAME=railway
      # DB_PORT=5432
    env_file:
      - ./backend/.env  # This file should contain Railway PostgreSQL credentials
    volumes:
      - ./backend/logs:/app/logs
      - ./backend/backups:/app/backups
    networks:
      - kommo-pulse-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: 
      context: ./kommo-pulse-main
      args:
        VITE_API_URL: http://localhost:3000/api
    container_name: kommo-pulse-frontend
    restart: unless-stopped
    environment:
      - PORT=80
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kommo-pulse-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for caching (recommended for high traffic)
  # redis:
  #   image: redis:7-alpine
  #   container_name: kommo-pulse-redis
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - kommo-pulse-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

networks:
  kommo-pulse-network:
    driver: bridge

